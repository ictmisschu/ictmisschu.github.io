<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>打印機的類別 · HKDSE ICT 溫習與測試卡</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-light: #64748b;
      --border: #cbd5e1;
      --success: #16a34a;
      --error: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
    header { text-align: center; margin-bottom: 15px; }
    header h1 { font-size: 1.4rem; color: var(--primary-dark); margin-bottom: 4px; }
    header h1 span { font-size: 0.85rem; font-weight: normal; color: var(--text-light); display: block; }

    /* 模式切換按鈕列 */
    .mode-selector { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
    .mode-btn { background: #e2e8f0; color: var(--text-light); border: none; padding: 6px 16px; border-radius: 20px; font-size: 0.9rem; cursor: pointer; font-weight: 600; transition: all 0.2s; }
    .mode-btn.active { background: var(--primary); color: white; }
    
    .container { max-width: 600px; width: 100%; margin: 0 auto; flex: 1; display: flex; flex-direction: column; justify-content: center; }
    
    /* 溫習卡樣式 */
    .card-container { perspective: 1000px; width: 100%; height: 320px; cursor: pointer; margin-bottom: 16px; }
    .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s ease; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06); }
    .card.is-flipped { transform: rotateY(180deg); }
    
    .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 16px; background: var(--card-bg); padding: 25px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; border: 2px solid var(--border); }
    .card-face.back { transform: rotateY(180deg); background: #eff6ff; border-color: #bfdbfe; align-items: flex-start; text-align: left; }
    
    .badge { background: #e2e8f0; color: var(--text-light); font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; margin-bottom: 12px; font-weight: bold; text-transform: uppercase; }
    .card-face.back .badge { background: #dbeafe; color: var(--primary); }
    
    h2 { font-size: 1.6rem; margin-bottom: 12px; color: var(--text); }
    .card-face.back h2 { font-size: 1.3rem; color: var(--primary-dark); border-bottom: 2px solid #bfdbfe; width: 100%; padding-bottom: 8px; margin-bottom: 10px; }
    
    p.hint { font-size: 0.85rem; color: var(--text-light); margin-top: 12px; }
    
    .points-list { list-style-type: disc; padding-left: 20px; font-size: 0.9rem; line-height: 1.5; color: var(--text); width: 100%; }
    .points-list li { margin-bottom: 4px; }

    /* 測驗模式樣式 */
    .quiz-card { background: var(--card-bg); border: 2px solid var(--border); border-radius: 16px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); display: none; flex-direction: column; margin-bottom: 16px; }
    .quiz-card.active-mode { display: flex; }
    .quiz-question { font-size: 1.05rem; font-weight: bold; margin-bottom: 16px; line-height: 1.5; }
    .options-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
    .option-btn { background: #f1f5f9; color: var(--text); border: 2px solid var(--border); padding: 12px 16px; border-radius: 10px; font-size: 0.95rem; text-align: left; cursor: pointer; transition: all 0.2s; }
    .option-btn:hover:not(:disabled) { background: #e2e8f0; border-color: var(--primary); }
    .option-btn.correct { background: #dcfce7; border-color: var(--success); color: #166534; font-weight: bold; }
    .option-btn.incorrect { background: #fee2e2; border-color: var(--error); color: #991b1b; }
    .quiz-feedback { font-size: 0.9rem; margin-top: 10px; min-height: 24px; font-weight: bold; }

    .controls { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    button.action-btn { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-size: 1rem; cursor: pointer; transition: background 0.2s; font-weight: 500; }
    button.action-btn:hover { background: var(--primary-dark); }
    button.action-btn:disabled { background: var(--border); cursor: not-allowed; }
    
    .counter { font-size: 0.9rem; color: var(--text-light); font-weight: bold; }
    .tip { text-align: center; font-size: 0.85rem; color: var(--text-light); margin-top: 12px; }
    footer { text-align: center; font-size: 0.75rem; color: var(--text-light); margin-top: 20px; }
  </style>
</head>
<body>

  <header>
    <h1>打印機類別 (Printer Types)
      <span>HKDSE ICT 核心單元 (Core B) 溫習工具</span>
    </h1>
    <!-- 模式選擇按鈕 -->
    <div class="mode-selector" style="margin-top: 12px;">
      <button class="mode-btn active" id="mode-study-btn" onclick="switchMode('study')">📖 溫習卡模式</button>
      <button class="mode-btn" id="mode-test-btn" onclick="switchMode('test')">📝 DSE 概念測試</button>
    </div>
  </header>

  <div class="container">
    <!-- 溫習卡介面 -->
    <div id="study-container">
      <div class="card-container" onclick="toggleCard()">
        <div class="card" id="flashcard">
          <!-- 正面 -->
          <div class="card-face front">
            <div class="badge" id="card-type">分類：衝擊式打印機</div>
            <h2 id="card-term">點陣式打印機 (Dot Matrix Printer)</h2>
            <p class="hint">👆 點擊卡片查看 DSE 考試重點</p>
          </div>
          <!-- 背面 -->
          <div class="card-face back">
            <div class="badge">HKDSE 考試重點 (Key Points)</div>
            <h2 id="card-term-back">點陣式打印機</h2>
            <ul class="points-list" id="card-points">
              <!-- 動態載入重點 -->
            </ul>
          </div>
        </div>
      </div>
      <div class="tip">💡 提示：點擊卡片可翻轉檢視溫習重點</div>
      <div class="controls">
        <button class="action-btn" id="prev-btn" onclick="prevCard()">上一張</button>
        <div class="counter" id="counter">1 / 4</div>
        <button class="action-btn" id="next-btn" onclick="nextCard()">下一張</button>
      </div>
    </div>

    <!-- 測驗卡介面 -->
    <div class="quiz-card" id="quiz-container">
      <div class="badge" id="quiz-badge">測試題目 1 / 4</div>
      <div class="quiz-question" id="quiz-question-text">載入中...</div>
      <div class="options-grid" id="quiz-options">
        <!-- 動態選項 -->
      </div>
      <div class="quiz-feedback" id="quiz-feedback"></div>
      <div class="controls" style="margin-top: 15px;">
        <span class="counter" id="quiz-score">得分：0</span>
        <button class="action-btn" id="quiz-next-btn" onclick="nextQuizQuestion()" style="display:none;">下一題</button>
      </div>
    </div>
  </div>

  <!-- <footer>根據 HKDSE 資訊及通訊科技課程編寫</footer> -->

  <script>
    const printers = [
      {
        type: "衝擊式打印機 (Impact Printer)",
        name: "點陣式打印機\n(Dot Matrix Printer)",
        points: [
          "運作原理：利用針（Pins）撞擊色帶（Ribbon）在紙張上留下點陣字體。",
          "主要優點：能透過複寫紙（Multi-part stationery / Carbon copies）**同時印出多份副本**。",
          "主要缺點：打印速度慢、運作時**噪音極大（Noisy）**、解像度及打印質素低。",
          "典型應用：銀行櫃位列印存摺、發出貨單／支票、大量連續報表。"
        ]
      },
      {
        type: "非衝擊式打印機 (Non-impact Printer)",
        name: "雷射打印機\n(Laser Printer)",
        points: [
          "運作原理：使用**碳粉（Toner）**、靜電感光鼓及熱力將碳粉熔合（Fused） en 紙上。",
          "主要優點：**打印速度極高（High speed，以 ppm 計算）**、解像度高、每頁平均消耗成本較低（適合大量文件）。",
          "主要缺點：初次購買機價及碳粉匣成本較高、體型較大。",
          "典型應用：辦公室日常大量文件、學校打印試卷。"
        ]
      },
      {
        type: "非衝擊式打印機 (Non-impact Printer)",
        name: "噴墨打印機\n(Inkjet Printer)",
        points: [
          "運作原理：透過噴嘴（Nozzles）將微細的**液體墨水（Ink droplets）**噴射到紙張上。",
          "主要優點：擅長印出色彩豐富的圖像，**高質素相片打印表現極佳**、機身細小、初期購買成本較低。",
          "主要缺點：如果長期不用容易堵塞噴嘴、墨水消耗成本相對較高（每頁成本較貴）、速度較雷射慢。",
          "典型應用：家庭用戶、小型辦公室、打印彩色相片或宣傳單張。"
        ]
      },
      {
        type: "非衝擊式打印機 (Non-impact Printer)",
        name: "感熱式打印機\n(Thermal Printer)",
        points: [
          "運作原理：利用加熱元件接觸**特殊感熱紙（Thermal paper）**，令其受熱變色形成文字或圖像。",
          "主要優點：**無需補充墨水或碳粉**、運作寂靜、體積細小、速度快。",
          "主要缺點：印出的收據日久會褪色、只能使用昂貴的專用感熱紙、通常只支援單色（多為黑／紅）。",
          "典型應用：超級市場收銀機、零售店發票（Receipts）、信用卡簽帳單、標籤打印。"
        ]
      }
    ];

    const quizQuestions = [
      {
        q: "哪一種打印機最適合用來列印需要「同時產生多份複寫副本（Carbon copies）」的銀行存摺或發貨單？",
        options: [
          "A. 雷射打印機 (Laser Printer)",
          "B. 噴墨打印機 (Inkjet Printer)",
          "C. 點陣式打印機 (Dot Matrix Printer)",
          "D. 感熱式打印機 (Thermal Printer)"
        ],
        answer: 2,
        explanation: "正確！點陣式打印機屬於衝擊式，能透過物理撞擊複寫紙印出多份副本。"
      },
      {
        q: "某超級市場收銀處需要一部高速、運作寧靜且「無需補充墨水或碳粉」的打印機來列印購物收據，應選擇哪一種？",
        options: [
          "A. 感熱式打印機 (Thermal Printer)",
          "B. 點陣式打印機 (Dot Matrix Printer)",
          "C. 雷射打印機 (Laser Printer)",
          "D. 噴墨打印機 (Inkjet Printer)"
        ],
        answer: 0,
        explanation: "正確！感熱式打印機使用感熱紙加熱變色，無需墨水或碳粉，非常適合收據打印。"
      },
      {
        q: "學校日常需要大量及極高速度（以 ppm 計算）列印黑白試卷，哪一款打印機最符合經濟及效率原則？",
        options: [
          "A. 噴墨打印機 (Inkjet Printer)",
          "B. 雷射打印機 (Laser Printer)",
          "C. 感熱式打印機 (Thermal Printer)",
          "D. 點陣式打印機 (Dot Matrix Printer)"
        ],
        answer: 1,
        explanation: "正確！雷射打印機使用碳粉，具備極高的列印速度且大量打印時每頁成本較低。"
      },
      {
        q: "關於噴墨打印機 (Inkjet Printer) 的特性，以下哪項描述是正確的？",
        options: [
          "A. 運作時會發出極大的機械噪音",
          "B. 使用靜電感光鼓與碳粉匣",
          "C. 印出的文字和收據日久會自動褪色",
          "D. 擅長列印色彩豐富的高質素相片"
        ],
        answer: 3,
        explanation: "正確！噴墨打印機能噴射微細墨滴，在相片列印上表現極佳。"
      }
    ];

    let currentMode = 'study';
    let currentIndex = 0;
    let quizIndex = 0;
    let score = 0;
    let answeredCurrent = false;

    // 模式切換
    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('mode-study-btn').classList.toggle('active', mode === 'study');
      document.getElementById('mode-test-btn').classList.toggle('active', mode === 'test');
      
      document.getElementById('study-container').style.display = mode === 'study' ? 'block' : 'none';
      document.getElementById('quiz-container').classList.toggle('active-mode', mode === 'test');

      if (mode === 'test') {
        initQuiz();
      }
    }

    // 溫習卡邏輯
    function updateCard() {
      const cardEl = document.getElementById('flashcard');
      cardEl.classList.remove('is-flipped');

      setTimeout(() => {
        const item = printers[currentIndex];
        document.getElementById('card-type').innerText = `分類：${item.type}`;
        document.getElementById('card-term').innerText = item.name.replace('\n', ' ');
        document.getElementById('card-term-back').innerText = item.name.replace('\n', ' ');

        const pointsList = document.getElementById('card-points');
        pointsList.innerHTML = '';
        item.points.forEach(point => {
          const li = document.createElement('li');
          li.innerHTML = point;
          pointsList.appendChild(li);
        });

        document.getElementById('counter').innerText = `${currentIndex + 1} / ${printers.length}`;
        document.getElementById('prev-btn').disabled = currentIndex === 0;
        document.getElementById('next-btn').disabled = currentIndex === printers.length - 1;
      }, 150);
    }

    function toggleCard() {
      document.getElementById('flashcard').classList.toggle('is-flipped');
    }

    function nextCard() {
      if (currentIndex < printers.length - 1) {
        currentIndex++;
        updateCard();
      }
    }

    function prevCard() {
      if (currentIndex > 0) {
        currentIndex--;
        updateCard();
      }
    }

    // 測驗模式邏輯
    function initQuiz() {
      quizIndex = 0;
      score = 0;
      loadQuizQuestion();
    }

    function loadQuizQuestion() {
      answeredCurrent = false;
      const qData = quizQuestions[quizIndex];
      document.getElementById('quiz-badge').innerText = `測試題目 ${quizIndex + 1} / ${quizQuestions.length}`;
      document.getElementById('quiz-question-text').innerText = qData.q;
      document.getElementById('quiz-feedback').innerText = '';
      document.getElementById('quiz-score').innerText = `得分：${score}`;
      document.getElementById('quiz-next-btn').style.display = 'none';

      const optionsContainer = document.getElementById('quiz-options');
      optionsContainer.innerHTML = '';

      qData.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => selectOption(idx);
        optionsContainer.appendChild(btn);
      });
    }

    function selectOption(selectedIndex) {
      if (answeredCurrent) return;
      answeredCurrent = true;

      const qData = quizQuestions[quizIndex];
      const buttons = document.querySelectorAll('.option-btn');
      const feedbackEl = document.getElementById('quiz-feedback');

      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === qData.answer) {
          btn.classList.add('correct');
        } else if (idx === selectedIndex) {
          btn.classList.add('incorrect');
        }
      });

      if (selectedIndex === qData.answer) {
        score += 25;
        feedbackEl.style.color = 'var(--success)';
        feedbackEl.innerText = '🎉 ' + qData.explanation;
      } else {
        feedbackEl.style.color = 'var(--error)';
        feedbackEl.innerText = '❌ 答錯了！' + qData.explanation;
      }

      document.getElementById('quiz-score').innerText = `得分：${score}`;
      
      if (quizIndex < quizQuestions.length - 1) {
        document.getElementById('quiz-next-btn').style.display = 'block';
        document.getElementById('quiz-next-btn').innerText = '下一題';
      } else {
        document.getElementById('quiz-next-btn').style.display = 'block';
        document.getElementById('quiz-next-btn').innerText = '重新測驗';
      }
    }

    function nextQuizQuestion() {
      quizIndex++;
      if (quizIndex < quizQuestions.length) {
        loadQuizQuestion();
      } else {
        initQuiz();
      }
    }

    // 初始化
    updateCard();
  </script>
</body>
</html>
