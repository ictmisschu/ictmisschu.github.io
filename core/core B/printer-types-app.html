<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打印機的類別 · HKDSE ICT</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+HK:wght@400;500;700;900&display=swap');

  :root{
    --paper: #F6F4EC;
    --paper-line: #DCD7C6;
    --ink: #1C1B18;
    --ink-soft: #55524A;
    --cyan: #0097B2;
    --magenta: #D6006D;
    --yellow: #E8A800;
    --key: #1C1B18;
    --card: #FFFFFF;
    --radius: 3px;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Noto Sans HK', -apple-system, sans-serif;
  }

  body{
    background-image:
      repeating-linear-gradient(180deg, transparent, transparent 27px, var(--paper-line) 27px, var(--paper-line) 28px);
    min-height: 100vh;
  }

  .sheet{
    max-width: 760px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  /* perforated edge strip */
  .perf{
    display:flex;
    justify-content: space-between;
    padding: 0 4px;
    margin-bottom: 18px;
  }
  .perf span{
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--paper-line);
  }

  header.masthead{
    border-bottom: 3px solid var(--ink);
    padding-bottom: 14px;
    margin-bottom: 28px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .masthead h1{
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: clamp(26px, 5vw, 38px);
    margin: 0;
    letter-spacing: -0.5px;
    line-height: 1.05;
  }
  .masthead .cn{
    font-family: 'Noto Sans HK', sans-serif;
    font-weight: 900;
    display:block;
    font-size: 0.55em;
    margin-top: 4px;
    color: var(--ink-soft);
    letter-spacing: 0;
  }

  .cmyk-dots{
    display:flex; gap: 6px;
  }
  .cmyk-dots span{
    width: 14px; height: 14px;
    border-radius: 50%;
  }
  .cmyk-dots span:nth-child(1){ background: var(--cyan); }
  .cmyk-dots span:nth-child(2){ background: var(--magenta); }
  .cmyk-dots span:nth-child(3){ background: var(--yellow); }
  .cmyk-dots span:nth-child(4){ background: var(--key); }

  nav.tabs{
    display:flex;
    gap: 0;
    margin-bottom: 28px;
    border: 2px solid var(--ink);
    border-radius: var(--radius);
    overflow: hidden;
    width: fit-content;
  }
  nav.tabs button{
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    font-weight: 700;
    background: var(--paper);
    color: var(--ink);
    border: none;
    padding: 10px 20px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  nav.tabs button + button{ border-left: 2px solid var(--ink); }
  nav.tabs button.active{
    background: var(--ink);
    color: var(--paper);
  }
  nav.tabs button:not(.active):hover{
    background: #ECE8DA;
  }

  section{ display:none; }
  section.active{ display:block; }

  /* ===== Flashcards ===== */
  .fc-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 18px;
  }

  .fc-progress{
    font-family:'Space Mono', monospace;
    font-size: 13px;
    color: var(--ink-soft);
  }

  .fc-stage{
    width: 100%;
    max-width: 520px;
    aspect-ratio: 4 / 3;
    perspective: 1400px;
    cursor: pointer;
  }

  .fc-inner{
    position: relative;
    width:100%; height:100%;
    transition: transform .5s cubic-bezier(.2,.8,.2,1);
    transform-style: preserve-3d;
  }
  .fc-stage.flipped .fc-inner{ transform: rotateY(180deg); }

  .fc-face{
    position:absolute; inset:0;
    backface-visibility: hidden;
    border: 2px solid var(--ink);
    border-radius: 6px;
    background: var(--card);
    padding: 28px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    box-shadow: 6px 6px 0 var(--ink);
  }

  .fc-face.back{
    transform: rotateY(180deg);
    background: #FDFBF4;
  }

  .fc-label{
    font-family:'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }

  .fc-face.front h2{
    font-size: clamp(22px, 4.5vw, 30px);
    margin: 0;
    line-height: 1.3;
  }
  .fc-face.front .accent-bar{
    width: 46px; height: 5px;
    margin-top: 16px;
    background: linear-gradient(90deg, var(--cyan), var(--magenta), var(--yellow));
  }
  .fc-face.front .hint-txt{
    margin-top: 18px;
    font-size: 14px;
    color: var(--ink-soft);
  }

  .fc-face.back p{
    font-size: 16px;
    line-height: 1.75;
    margin: 0;
  }

  .fc-tap-hint{
    text-align:center;
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 4px;
  }

  .fc-controls{
    display:flex;
    gap: 14px;
    align-items:center;
  }
  .btn{
    font-family:'Space Mono', monospace;
    font-weight: 700;
    font-size: 13px;
    border: 2px solid var(--ink);
    background: var(--paper);
    color: var(--ink);
    padding: 10px 18px;
    border-radius: var(--radius);
    cursor:pointer;
    transition: transform .1s ease, background .15s ease;
  }
  .btn:hover{ background: #ECE8DA; }
  .btn:active{ transform: translateY(2px); }
  .btn.primary{
    background: var(--ink);
    color: var(--paper);
  }
  .btn.primary:hover{ background: #33312B; }
  .btn:disabled{ opacity: .35; cursor:not-allowed; }

  .fc-dots{
    display:flex; gap:6px; flex-wrap:wrap; justify-content:center; max-width: 400px;
  }
  .fc-dots span{
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--paper-line);
    border: 1px solid var(--ink-soft);
    cursor:pointer;
  }
  .fc-dots span.current{ background: var(--ink); }

  /* ===== Quiz ===== */
  .quiz-head{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom: 18px; flex-wrap:wrap; gap:8px;
  }
  .quiz-progress{
    font-family:'Space Mono', monospace; font-size: 13px; color: var(--ink-soft);
  }
  .quiz-score{
    font-family:'Space Mono', monospace; font-size: 13px; color: var(--ink-soft);
  }

  .q-card{
    border: 2px solid var(--ink);
    border-radius: 6px;
    background: var(--card);
    padding: 26px;
    box-shadow: 6px 6px 0 var(--ink);
    margin-bottom: 20px;
  }

  .q-card .q-num{
    font-family:'Space Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }
  .q-card h3{
    margin: 0 0 20px;
    font-size: clamp(17px, 3.5vw, 20px);
    line-height: 1.5;
  }

  .opt{
    display:block;
    width:100%;
    text-align:left;
    font-family:'Noto Sans HK', sans-serif;
    font-size: 15px;
    padding: 13px 16px;
    margin-bottom: 10px;
    background: var(--paper);
    border: 2px solid var(--ink-soft);
    border-radius: var(--radius);
    cursor:pointer;
    transition: border-color .12s ease, background .12s ease;
  }
  .opt:hover{ border-color: var(--ink); }
  .opt.selected{ border-color: var(--ink); background:#ECE8DA; }
  .opt.correct{ border-color: var(--cyan); background: #E3F5F7; }
  .opt.wrong{ border-color: var(--magenta); background: #FBE5F0; }
  .opt:disabled{ cursor:default; }

  .feedback{
    margin-top: 14px;
    padding: 14px 16px;
    border-radius: var(--radius);
    font-size: 14px;
    line-height: 1.7;
    display:none;
  }
  .feedback.show{ display:block; }
  .feedback.right{ background:#E3F5F7; border-left: 4px solid var(--cyan); }
  .feedback.wrong-fb{ background:#FBE5F0; border-left: 4px solid var(--magenta); }
  .feedback b{ display:block; margin-bottom: 4px; }

  .quiz-nav{
    display:flex; justify-content: space-between; align-items:center;
  }

  .result{
    text-align:center;
    padding: 40px 20px;
  }
  .result .big{
    font-family:'Space Mono', monospace;
    font-size: 52px;
    font-weight: 700;
  }
  .result p{ color: var(--ink-soft); }

  footer{
    text-align:center;
    font-family:'Space Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 40px;
    padding-top: 16px;
    border-top: 1px solid var(--paper-line);
  }

  @media (max-width:520px){
    .sheet{ padding: 24px 16px 60px; }
    .fc-face{ padding: 20px; }
  }

  @media (prefers-reduced-motion: reduce){
    .fc-inner{ transition: none; }
  }
</style>
</head>
<body>

<div class="sheet">
  <div class="perf">
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
  </div>

  <header class="masthead">
    <h1>PRINTER TYPES
      <span class="cn">打印機的類別 · HKDSE ICT 核心單元</span>
    </h1>
    <div class="cmyk-dots"><span></span><span></span><span></span><span></span></div>
  </header>

  <nav class="tabs">
    <button class="active" data-tab="flash">FLASHCARDS</button>
    <button data-tab="quiz">QUIZ</button>
  </nav>

  <!-- ===== FLASHCARDS ===== -->
  <section id="flash" class="active">
    <div class="fc-wrap">
      <div class="fc-progress" id="fcProgress">1 / 5</div>

      <div class="fc-stage" id="fcStage">
        <div class="fc-inner" id="fcInner">
          <div class="fc-face front">
            <div class="fc-label">TERM</div>
            <h2 id="fcFront"></h2>
            <div class="accent-bar"></div>
            <div class="hint-txt">撳一下卡片，睇特性重點</div>
          </div>
          <div class="fc-face back">
            <div class="fc-label">重點</div>
            <p id="fcBack"></p>
          </div>
        </div>
      </div>
      <div class="fc-tap-hint">撳卡片翻轉</div>

      <div class="fc-controls">
        <button class="btn" id="fcPrev">← 上一張</button>
        <button class="btn primary" id="fcFlipBtn">翻轉</button>
        <button class="btn" id="fcNext">下一張 →</button>
      </div>

      <div class="fc-dots" id="fcDots"></div>
    </div>
  </section>

  <!-- ===== QUIZ ===== -->
  <section id="quiz">
    <div id="quizArea"></div>
  </section>

  <footer>SECICTFC_c_FC_DSE_CB03 &middot; 練習內容根據 HKDSE ICT 課程主題編寫</footer>
</div>

<script>
const CARDS = [
  {
    term: "點陣式打印機",
    sub: "Dot Matrix Printer",
    back: "撞擊式：用打印針撞擊色帶印在紙上　·　可同時打印多份複寫副本　·　噪音大、質素較低　·　常用於發票、收據"
  },
  {
    term: "噴墨打印機",
    sub: "Inkjet Printer",
    back: "非撞擊式：將微細墨點噴射到紙上　·　彩色印刷質素高　·　適合家庭使用及相片列印　·　墨水盒成本相對較高"
  },
  {
    term: "激光打印機",
    sub: "Laser Printer",
    back: "非撞擊式：利用碳粉及靜電原理　·　打印速度快、質素高、每張成本低　·　適合辦公室大量黑白或彩色列印"
  },
  {
    term: "熱感打印機",
    sub: "Thermal Printer",
    back: "非撞擊式：用熱力喺感熱紙上顯影　·　速度快、噪音低、結構簡單　·　列印字跡隔一段時間會褪色　·　常用於收銀機、標籤"
  },
  {
    term: "3D打印機",
    sub: "3D Printer",
    back: "透過層層堆疊物料（如塑膠、金屬粉）建構立體物件　·　常用於建模、醫療、工業設計等領域"
  }
];

const QUESTIONS = [
  {
    q: "以下邊種打印機屬於「撞擊式」(impact) 打印機？",
    opts: ["噴墨打印機", "激光打印機", "點陣式打印機", "熱感打印機"],
    correct: 2,
    exp: "點陣式打印機透過打印針撞擊色帶留下印記，屬於撞擊式；其餘三種都是非撞擊式 (non-impact)。"
  },
  {
    q: "邊種打印機最適合用嚟大量打印文件，速度快、質素高？",
    opts: ["噴墨打印機", "激光打印機", "點陣式打印機", "3D打印機"],
    correct: 1,
    exp: "激光打印機利用碳粉及靜電原理，打印速度快、質素高，適合辦公室大量打印。"
  },
  {
    q: "噴墨打印機 (Inkjet printer) 嘅主要工作原理係？",
    opts: ["用打印針撞擊色帶", "將微細墨點噴射到紙上", "用高溫燒灼特製紙張", "用碳粉及靜電原理"],
    correct: 1,
    exp: "噴墨打印機透過噴嘴將微細墨點直接噴射到紙上組成文字或圖像，適合打印彩色相片。"
  },
  {
    q: "超市收銀機打印嘅單據通常用邊種打印機？",
    opts: ["激光打印機", "熱感打印機", "3D打印機", "噴墨打印機"],
    correct: 1,
    exp: "熱感打印機利用熱力喺感熱紙上顯影，速度快、噪音低，常用於收銀單據及標籤打印。"
  },
  {
    q: "以下邊項係點陣式打印機嘅優點？",
    opts: ["打印質素最高", "可以一次過打印多份複寫副本", "完全冇噪音", "打印速度最快"],
    correct: 1,
    exp: "點陣式打印機靠實際撞擊打印，可透過複寫紙同時打印多份副本，常用於需要副本的文件。"
  },
  {
    q: "邊種打印機能夠打印出立體實體物件？",
    opts: ["3D打印機", "熱感打印機", "激光打印機", "點陣式打印機"],
    correct: 0,
    exp: "3D打印機透過層層堆疊物料（如塑膠、金屬粉）建構立體物件，常用於建模、醫療及工業設計。"
  }
];

/* ---------- Tabs ---------- */
document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
  });
});

/* ---------- Flashcards ---------- */
let fcIndex = 0;
const fcStage = document.getElementById('fcStage');
const fcFront = document.getElementById('fcFront');
const fcBack = document.getElementById('fcBack');
const fcProgress = document.getElementById('fcProgress');
const fcDots = document.getElementById('fcDots');

function renderDots(){
  fcDots.innerHTML = '';
  CARDS.forEach((_,i)=>{
    const d = document.createElement('span');
    if(i===fcIndex) d.classList.add('current');
    d.addEventListener('click', ()=>{ fcIndex = i; showCard(false); });
    fcDots.appendChild(d);
  });
}

function showCard(flipped){
  const c = CARDS[fcIndex];
  fcFront.innerHTML = c.term + '<br><span style="font-family:\'Space Mono\',monospace;font-size:0.5em;color:var(--ink-soft);">' + c.sub + '</span>';
  fcBack.textContent = c.back;
  fcStage.classList.toggle('flipped', flipped);
  fcProgress.textContent = (fcIndex+1) + ' / ' + CARDS.length;
  renderDots();
}

fcStage.addEventListener('click', ()=>{
  fcStage.classList.toggle('flipped');
});
document.getElementById('fcFlipBtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  fcStage.classList.toggle('flipped');
});
document.getElementById('fcPrev').addEventListener('click', ()=>{
  fcIndex = (fcIndex - 1 + CARDS.length) % CARDS.length;
  showCard(false);
});
document.getElementById('fcNext').addEventListener('click', ()=>{
  fcIndex = (fcIndex + 1) % CARDS.length;
  showCard(false);
});

showCard(false);

/* ---------- Quiz ---------- */
let qIndex = 0;
let score = 0;
let answered = false;
const quizArea = document.getElementById('quizArea');

function renderQuestion(){
  answered = false;
  const item = QUESTIONS[qIndex];
  quizArea.innerHTML = `
    <div class="quiz-head">
      <div class="quiz-progress">第 ${qIndex+1} 題 / 共 ${QUESTIONS.length} 題</div>
      <div class="quiz-score">得分：${score}</div>
    </div>
    <div class="q-card">
      <div class="q-num">Q${qIndex+1}</div>
      <h3>${item.q}</h3>
      <div id="optsWrap"></div>
      <div class="feedback" id="feedback"></div>
    </div>
    <div class="quiz-nav">
      <button class="btn" id="qPrev" ${qIndex===0 ? 'disabled':''}>← 上一題</button>
      <button class="btn primary" id="qNext" disabled>${qIndex===QUESTIONS.length-1 ? '完成' : '下一題 →'}</button>
    </div>
  `;

  const optsWrap = document.getElementById('optsWrap');
  item.opts.forEach((opt, i)=>{
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = opt;
    b.addEventListener('click', ()=> selectAnswer(i));
    optsWrap.appendChild(b);
  });

  document.getElementById('qPrev').addEventListener('click', ()=>{
    if(qIndex>0){ qIndex--; renderQuestion(); }
  });
  document.getElementById('qNext').addEventListener('click', ()=>{
    if(qIndex < QUESTIONS.length-1){
      qIndex++;
      renderQuestion();
    } else {
      renderResult();
    }
  });
}

function selectAnswer(i){
  if(answered) return;
  answered = true;
  const item = QUESTIONS[qIndex];
  const opts = document.querySelectorAll('.opt');
  opts.forEach(o=> o.disabled = true);

  if(i === item.correct){
    score++;
    opts[i].classList.add('correct');
  } else {
    opts[i].classList.add('wrong');
    opts[item.correct].classList.add('correct');
  }

  const fb = document.getElementById('feedback');
  fb.classList.add('show', i===item.correct ? 'right' : 'wrong-fb');
  fb.innerHTML = `<b>${i===item.correct ? '答對了！' : '答錯了'}</b>${item.exp}`;

  document.getElementById('qNext').disabled = false;
  document.querySelector('.quiz-score').textContent = '得分：' + score;
}

function renderResult(){
  const pct = Math.round((score/QUESTIONS.length)*100);
  quizArea.innerHTML = `
    <div class="q-card result">
      <div class="fc-label" style="text-align:center;">RESULT</div>
      <div class="big">${score} / ${QUESTIONS.length}</div>
      <p>正確率 ${pct}%</p>
      <button class="btn primary" id="qRestart">重新測驗</button>
    </div>
  `;
  document.getElementById('qRestart').addEventListener('click', ()=>{
    qIndex = 0; score = 0; renderQuestion();
  });
}

renderQuestion();
</script>

</body>
</html>
