<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HKDSE ICT - Online Test</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/passpaper.css" />
    <script src="../navigation.js" defer></script>
    <script src="../footer.js" defer></script>
    <script src="../passpaper.js" defer></script>
  </head>
  <body>
    <div id="site-navigation"></div>

    <main class="passpaper-page">
      <section class="passpaper-intro" aria-label="考試資源">
        <h2>HKDSE ICT Passpaper</h2>
        <p>香港中學文憑資訊及通訊科技考試卷與學生表現示例。</p>
        <p class="passpaper-resource-label">Online Test Mode　線上練習</p>
      </section>

      <section class="practice-selector" aria-labelledby="practice-selector-title">
        <h2 id="practice-selector-title">按年份選擇線上練習</h2>
        <label for="practice-year">選擇試題年份</label>
        <select id="practice-year" name="practice-year" data-practice-base="./">
          <option value="">請選擇年份</option>
          <option value="2026">2026</option>
          <option value="2025">2025</option>
          <option value="2024">2024</option>
          <option value="2023">2023</option>
          <option value="2022">2022</option>
          <option value="2021">2021</option>
          <option value="2020">2020</option>
          <option value="2019">2019</option>
          <option value="2018">2018</option>
          <option value="2013">2013</option>
        </select>
        <div class="practice-results" id="practice-results" aria-live="polite">
          <p>請選擇年份以查看可用的練習。</p>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>
  </body>
</html>
